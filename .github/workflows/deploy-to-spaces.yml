name: Deploy to Hugging Face Space
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SPACE_ID=Sementes/Simulador_Carbono   # <-- ajuste aqui
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          # Clona a Space usando o token
          git clone https://$HF_TOKEN@huggingface.co/spaces/$SPACE_ID hf-space

          # Sincroniza os arquivos do repo para a Space
          rsync -av --delete --exclude ".git" --exclude ".github" ./ hf-space/

          cd hf-space
          git add -A
          git commit -m "Sync from GitHub" || echo "No changes to commit"
          git push
